    <meta property="og:title" content="Clube das Raposinhas - Contos de Fadas, Princesas e Histórias Encantadas" />
    <meta property="og:description" content="Aplicativo PWA mobile-first do Clube de Assinatura das Raposinhas: contos de fadas, narrativas medievais e histórias encantadas com leitura imersiva e áudio completo narrado." />
    <meta property="og:type" content="website" />

    <!-- PWA Settings -->
    <meta name="theme-color" content="#4A2C6A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Google Fonts for Fairy Tale Medieval Aesthetics -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#1A1A1A] text-[#1A1A1A] antialiased selection:bg-[#D4AF37]/30 selection:text-[#4A2C6A] select-none">
    <script>
      // Suprimir erros de desconexão de WebSocket do HMR em ambientes de proxy/nuvem
      window.addEventListener('error', function(e) {
        if (e && e.message && (e.message.includes('WebSocket') || e.message.includes('websocket'))) {
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e && (e.reason ? (e.reason.message || String(e.reason)) : '');
        if (reason && (reason.includes('WebSocket') || reason.includes('websocket'))) {
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
